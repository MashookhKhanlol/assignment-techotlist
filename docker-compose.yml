services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillgap-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - CORS_ORIGINS=http://localhost:3002,https://skillgap.flowcrafted.me
    networks:
      - internal
    # Backend is NOT exposed externally — only reachable from frontend container
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: skillgap-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    environment:
      - BACKEND_URL=http://backend:8000

networks:
  internal:
    driver: bridge
