# Nginx server block for skillgap.flowcrafted.me
# ─────────────────────────────────────────────────────────────────────────────
# Setup (run on VPS):
#
#   1. Ensure Cloudflare is set to DNS Only (grey cloud) — NOT proxied
#      Let's Encrypt ACME challenge must reach VPS directly.
#
#   2. Install Certbot:
#      sudo apt install -y certbot python3-certbot-nginx
#
#   3. Copy this file and enable it:
#      sudo cp ~/assignment/assignment-techotlist/nginx/skillgap.conf \
#               /etc/nginx/sites-available/skillgap.conf
#      sudo ln -sf /etc/nginx/sites-available/skillgap.conf \
#                  /etc/nginx/sites-enabled/skillgap.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#   4. Obtain the certificate (Certbot auto-fills the ssl_* lines below):
#      sudo certbot --nginx -d skillgap.flowcrafted.me \
#                   --non-interactive --agree-tos -m your@email.com
#
#   5. Verify auto-renewal:
#      sudo certbot renew --dry-run
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: ACME challenge passthrough + redirect to HTTPS ─────────────────────
server {
    listen 80;
    server_name skillgap.flowcrafted.me;

    # Let Certbot's ACME HTTP-01 challenge through (must NOT redirect this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main server block ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name skillgap.flowcrafted.me;

    # Let's Encrypt certificate — Certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/skillgap.flowcrafted.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillgap.flowcrafted.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large resume/JD file uploads (PDF can be several MB)
    client_max_body_size 20M;

    # Proxy to the Next.js frontend container on port 3002
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extra timeout for LLM calls (Claude can take a few seconds)
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
