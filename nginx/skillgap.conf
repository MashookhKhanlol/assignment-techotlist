# Nginx server block for skillgap.flowcrafted.me
# Place this file at: /etc/nginx/sites-available/skillgap.conf
# Then symlink: sudo ln -s /etc/nginx/sites-available/skillgap.conf /etc/nginx/sites-enabled/
# And reload:   sudo systemctl reload nginx

server {
    listen 80;
    server_name skillgap.flowcrafted.me;

    # Redirect HTTP → HTTPS (Cloudflare handles the cert, but keep this for direct hits)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skillgap.flowcrafted.me;

    # If Cloudflare Full (Strict) mode: provide an origin certificate
    # ssl_certificate     /etc/ssl/certs/skillgap.flowcrafted.me.pem;
    # ssl_certificate_key /etc/ssl/private/skillgap.flowcrafted.me.key;

    # Allow large resume/JD uploads
    client_max_body_size 20M;

    # Frontend (Next.js container)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
